<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acesso Livro 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #5a189a, #ffffff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    input {
      padding: 10px;
      width: 100%;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      padding: 12px 25px;
      background: #5a189a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #3c096c;
    }
  </style>
</head>

<body>

  <div class="card">
   <h2>🔒 Livro 2 — Acesso Protegido</h2>

<input
  type="password"
  id="senha"
  placeholder="Digite a senha"
  style="padding:10px; font-size:16px; border-radius:8px; width:220px;"
>

<br><br>

<button onclick="verificarSenha()"
style="
  padding:10px 20px;
  font-size:16px;
  background:#6c63ff;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
">
  Entrar
</button>

<p id="mensagem" style="color:red; margin-top:10px;"></p>

<script>
function verificarSenha() {
  const senha = document.getElementById("senha").value;
  const mensagem = document.getElementById("mensagem");

  if (senha === "1299") {
    window.location.href = "livro2-secreto.html";
  } else {
    mensagem.innerText = "❌ Senha incorreta";
  }
}
</script>

  </script>
<div style="text-align:center; margin-top:40px;">
  <a href="livro3.html">
    <button style="
      padding:15px 30px;
      font-size:18px;
      background-color:#4CAF50;
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
    ">
      Ir para o Livro 3 →
    </button>
  </a>
</div>
    
var senha = prompt("Digite a senha para acessar o livro:");

if(senha !== "cliente"){
alert("Senha incorreta!");
window.location.href = "index.html";
}
</script>
</body>
</html>
