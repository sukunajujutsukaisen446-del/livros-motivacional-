<!DOCTYPE html>
<html lang="pt-BR">

    h1 {
      color: #5a189a;
      margin-bottom: 15px;
    }

    p {
      color: #333;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .botao {
      display: inline-block;
      padding: 14px 25px;
      background: #5a189a;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
    }

    .botao:hover {
      background: #3c096c;
      transform: scale(1.05);

</head>
