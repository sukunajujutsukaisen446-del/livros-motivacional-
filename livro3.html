<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acesso Livro 3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #006466, #ffffff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    input {
      padding: 10px;
      width: 100%;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      padding: 12px 25px;
      background: #006466;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #004d4f;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>🔒 Livro 3 Protegido</h2>
    <p>Digite a senha para acessar</p>

    <input type="password" id="senha">
    <button onclick="verificar()">Entrar</button>
  </div>

  <script>
    function verificar() {
      const senha = document.getElementById("senha").value;

      if (senha === "LIVRO3-OBEDIENCIA") {
        alert("✅ Acesso liberado");
        // aqui depois você pode redirecionar para um livro3-secreto.html
      } else {
        alert("❌ Senha incorreta");
      }
    }
  </script>

</body>
</html>
