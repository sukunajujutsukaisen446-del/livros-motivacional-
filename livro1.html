<input type="password" id="senha" placeholder="Digite a senha">
<button onclick="verificarSenha()">Entrar</button>
<div id="resultado"></div>

<script>
function verificarSenha() {
  const senha = document.getElementById("senha").value;

  if (senha === "LIVRO1-123nem") {
    document.getElementById("resultado").innerHTML = `
      <p style="color:green;font-weight:bold;">Acesso permitido</p>
      <button onclick="irParaLivro()">Ir para o Livro 1</button>
    `;
  } else {
    document.getElementById("resultado").innerHTML =
      "<p style='color:red;'>Senha incorreta</p>";
  }
}

function irParaLivro() {
  window.location.href = "livro1-conteudo.html";
}
</script>
