<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Oferta Especial 🔥</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#f4f6f8;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .box{
      background:#fff;
      padding:40px;
      max-width:500px;
      width:90%;
      border-radius:16px;
      box-shadow:0 8px 20px rgba(0,0,0,.12);
      text-align:center;
    }

    h1{
      color:#e63946;
      margin-bottom:10px;
    }

    .price{
      font-size:32px;
      font-weight:bold;
      margin:20px 0;
    }

    .pix{
      background:#f1f1f1;
      padding:15px;
      border-radius:10px;
      font-weight:bold;
      word-break:break-all;
    }

    button{
      margin-top:20px;
      padding:14px 30px;
      border:none;
      border-radius:30px;
      background:#2d8cff;
      color:#fff;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      opacity:.9;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>🔥 Oferta Exclusiva</h1>
    <p>Você desbloqueou uma condição especial</p>

    <div class="price">
      Apenas <span style="color:#e63946;">5 reais ❤️🔥</span>
    </div>

    <p>Pagamento via Pix</p>

    <div class="pix">
      👉 12991078958👈
    </div>

    <button onclick="alert('Após o pagamento, envie o comprovante 💙')">
      Já paguei
    </button>
  </div>

</body>
</html>
