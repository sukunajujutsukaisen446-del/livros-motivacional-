<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Livros Motivacionais</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, Helvetica, sans-serif;
  background:#f2f2f2;
  margin:0;
}
.container{
  max-width:800px;
  margin:40px auto;
  background:#fff;
  padding:30px;
  border-radius:10px;
  box-shadow:0 0 15px rgba(0,0,0,.1);
  text-align:center;
}
button{
  padding:12px 25px;
  border:none;
  border-radius:6px;
  background:#6a1b9a;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}
input{
  padding:10px;
  width:80%;
  max-width:300px;
}
.pix{
  margin-top:40px;
  border-top:1px solid #ddd;
  padding-top:20px;
}
</style>
</head>

<body>

<div class="container">
  <h1>📘 Livros Motivacionais</h1>

  <p>
    📚 Aqui você encontra textos e livros motivacionais que inspiram,
    elevam sua autoestima e ajudam a superar desafios da vida. ✨
  </p>

  <p style="color:#6a1b9a;font-weight:bold;">Apenas 10 reais</p>

  <!-- BOTÃO FIXO -->
  <button onclick="mostrarSenha(1)">Acessar Livro 1</button>

  <div id="area"></div>
  <p id="erro" style="color:red;"></p>

  <div class="pix">
    <h3>💰 PAGAMENTO VIA PIX</h3>
    <p><b>Chave PIX:</b> 1299107-8958</p>
  </div>
</div>

<script>
const senhas = {
  1: "LIVRO1-123nem",
  2: "LIVRO2-123",
  3: "LIVRO3-123"
};

function mostrarSenha(livro){
  document.getElementById("erro").innerText = "";
  document.getElementById("area").innerHTML = `
    <p>Digite a senha do Livro ${livro}</p>
    <input type="password" id="senha${livro}">
    <br>
    <button onclick="verificar(${livro})">Entrar</button>
  `;
}

function verificar(livro){
  const senha = document.getElementById("senha"+livro).value;

  if(senha === senhas[livro]){
    abrirLivro(livro);
  }else{
    document.getElementById("erro").innerText = "Senha incorreta";
  }
}

function abrirLivro(livro){
  if(livro === 1){
    document.getElementById("area").innerHTML = `
      <h3>📘 Livro 1</h3>
      <p>Recomeçar Sempre</p>
      <button onclick="mostrarSenha(2)">Acessar Livro 2</button>
    `;
  }

  if(livro === 2){
    document.getElementById("area").innerHTML = `
      <h3>📘 Livro 2</h3>
      <p>Você não está sozinho</p>
      <button onclick="mostrarSenha(3)">Acessar Livro 3</button>
    `;
  }

  if(livro === 3){
    window.location.href = "livro3.html";
  }
}
</script>

</body>
</html>
