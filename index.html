<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Livros Motivacionais</title>

<style>
body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

header{
background:#2f6fd6;
color:white;
padding:30px;
}

.card{
background:white;
margin:20px auto;
padding:20px;
width:300px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
background:#ff3b3b;
color:white;
cursor:pointer;
}

button:hover{
opacity:0.8;
}
</style>

</head>
<body>

<header>
<h1>📚 Livros Motivacionais</h1>
<p>Entre com Google para acessar</p>
</header>

<div class="card">
<h3>Login</h3>
<button onclick="loginGoogle()">Entrar com Google</button>
<p id="user"></p>
</div>

<div class="card">
<h3>Livro 1 — Disciplina e Superação</h3>
<button>Acessar</button>
</div>

<div class="card">
<h3>Livro 2 — Você Não Está Sozinho</h3>
<button>Acessar</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
apiKey: "COLOQUE_SUA_API_KEY",
authDomain: "livro-motivacional-7f8ae.firebaseapp.com",
projectId: "livro-motivacional-7f8ae",
storageBucket: "livro-motivacional-7f8ae.firebasestorage.app",
messagingSenderId: "276480728749",
appId: "COLOQUE_SEU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.loginGoogle = function(){

signInWithPopup(auth, provider)

.then((result)=>{

const user = result.user;

document.getElementById("user").innerHTML =
"Logado como: "+user.displayName;

})

.catch((error)=>{
console.log(error);
});

}

</script>

</body>
</html>
