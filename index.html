<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Livros Motivacionais</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      color: #333;
      padding: 40px 25px;
      border-radius: 15px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 15px;
      color: #6a11cb;
    }

    p {
      font-size: 1.05em;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #6a11cb;
      color: white;
    }

    button:hover {
      background: #5311a8;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📚 Livros Motivacionais</h1>

    <p>
      Aqui você encontra livros e textos para fortalecer a mente
      e continuar mesmo nos dias difíceis.
    </p>

    <button onclick="window.location.href='livro1.html'">
      Acessar Livro 1
    </button>

    <button onclick="window.location.href='livro2.html'">
      Acessar Livro 2
    </button>
  </div>

</body>
</html>
