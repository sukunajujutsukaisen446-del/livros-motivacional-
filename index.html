<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Livros Motivacionais</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #000;
    }

    .descricao {
      font-size: 15px;
      color: #333;
      margin: 15px 0;
    }

    .preco {
      font-weight: bold;
      margin: 10px 0 20px;
    }

    .btn {
      display: inline-block;
      background: #7b2cbf;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
    }

    .btn:hover {
      background: #5a189a;
    }

    .pix {
      margin-top: 30px;
      font-size: 14px;
      color: #333;
    }

    .pix strong {
      display: block;
      margin-top: 8px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>📚 Livros Motivacionais</h1>

    <div class="descricao">
      📖 Aqui você encontra textos e livros motivacionais que inspiram,
      elevam sua autoestima e ajudam a superar desafios da vida. ✨
    </div>

    <div class="preco">Apenas 10 reais</div>

    <a class="btn" href="livro1.html">Acessar Livro 1</a>

    <div class="pix">
      💰 <strong>PAGAMENTO VIA PIX</strong>
      Chave PIX: <strong>1299107-8958</strong>
      <br><br>
      Após o pagamento, envie o comprovante para receber a senha.
    </div>
  </div>

</body>
</html>
