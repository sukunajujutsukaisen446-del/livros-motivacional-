<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Livros Motivacionais</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      color: #2c3e50;
    }

    .descricao {
      max-width: 700px;
      margin: 20px auto;
      font-size: 1.1em;
      color: #555;
    }

    .preco {
      margin: 20px 0;
      font-weight: bold;
      color: #27ae60;
      font-size: 1.2em;
    }

    button {
      display: block;
      width: 260px;
      margin: 15px auto;
      padding: 15px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #3498db;
      color: white;
    }

    button:hover {
      background: #2980b9;
    }

    footer {
      margin-top: 40px;
      color: #666;
      font-size: 0.9em;
    }
  </style>
</head>

<body>

  <h1>📚 Livros Motivacionais</h1>

  <p class="descricao">
    📚 Aqui você encontra textos e livros motivacionais que inspiram, elevam sua autoestima e ajudam a superar desafios da vida. ✨
  </p>

  <p class="preco">Apenas 10 reais</p>

  <!-- LIVRO 1 (SEM SENHA) -->
  <button onclick="window.location.href='livro1.html'">
    Acessar Livro 1
  </button>

  <!-- LIVRO 2 (SEM SENHA) -->
  <button onclick="window.location.href='livro2.html'">
    Acessar Livro 2
  </button>

  <!-- LIVRO 3 (COM SENHA) -->
  <button onclick="acessarLivro3()">
    🔒 Acessar Livro 3
  </button>

  <footer>
    <p>Chave Pix: 1299107-8958</p>
    <p>© 2026 — Allyson</p>
  </footer>

  <script>
    function acessarLivro3() {
      let senha = prompt("Digite a senha do Livro 3:");

      if (senha === "LIVRO3-123") {
        window.location.href = "livro3.html";
      } else {
        alert("Senha incorreta!");
      }
    }
  </script>

</body>
</html>
