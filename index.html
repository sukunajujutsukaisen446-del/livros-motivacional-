<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Livros Motivacional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a0dad, #ffffff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      color: #6a0dad;
      margin-bottom: 5px;
    }

    small {
      color: #555;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #6a0dad;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #4e0a86;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>LIVROS MOTIVACIONAL</h1>
    <small>ALLYSON</small>

    <br><br>

    <button onclick="acessarLivro()">Acessar Livro 1</button>
  </div>

  <script>
    function acessarLivro() {
      const senha = prompt("Digite a senha de acesso:");

      if (senha === "livro10") {
        window.location.href = "livro1.html";
      } else {
        alert("Acesso negado. Senha incorreta.");
      }
    }
  </script>

</body>
</html>
